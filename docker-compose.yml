services:
  postgres:
    image: postgres:16-alpine
    container_name: whale-sniper-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: whale
      POSTGRES_PASSWORD: whale
      POSTGRES_DB: whale_sniper
    ports:
      - "5432:5432"
    volumes:
      - whale-sniper-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whale -d whale_sniper"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  whale-sniper-pgdata:
